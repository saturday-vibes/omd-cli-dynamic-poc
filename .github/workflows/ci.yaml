name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get node version
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test --ci
      - name: Against the real registry
        env:
          OMD_CACHE_DIR: ${{ runner.temp }}/omd-cache
        run: |
          node dist/bin/omd.js schema versions
          node dist/bin/omd.js schema show --kind service
          node dist/bin/omd.js schema show --kind component --version v1.0.0 | head -3
          node dist/bin/omd.js validate test/repos/service-catalog-backstage --skip-backstage --repo wbd-streaming/service-catalog-backstage --format text
